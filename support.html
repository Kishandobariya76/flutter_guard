<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buy me a chai — FlutterGuard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ea;
      --card: #fffdf8;
      --ink: #1f1a14;
      --muted: #6b6256;
      --chai: #c67b2e;
      --line: #e6dcc8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
    .qr {
      display: none;
      width: 220px;
      height: 220px;
      margin: 0 auto 8px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .pay {
      display: none;
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 14px 16px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      background: var(--chai);
      color: #fff;
      width: 100%;
    }
    .desktop .qr { display: inline-block; }
    .mobile .pay { display: inline-block; }
  </style>
</head>
<body>
  <main>
    <h1>Buy me a chai</h1>
    <p id="blurb"></p>
    <img id="qr" class="qr" alt="Pay with UPI">
    <a id="pay" class="pay" href="#">Pay with UPI</a>
  </main>
  <script>
    const payUrl =
      "upi://pay?pa=" + encodeURIComponent("kishup713-3@okicici") +
      "&pn=" + encodeURIComponent("Kishan Dobariya") +
      "&cu=INR&tn=" + encodeURIComponent("Buy me a chai");
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    document.body.className = mobile ? "mobile" : "desktop";
    document.getElementById("pay").href = payUrl;
    document.getElementById("blurb").textContent = mobile
      ? "Opening your UPI app…"
      : "Scan this QR with any UPI app.";
    if (!mobile) {
      document.getElementById("qr").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
        encodeURIComponent(payUrl);
    } else {
      window.location.replace(payUrl);
    }
  </script>
</body>
</html>

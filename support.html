<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buy me a chai — FlutterGuard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ea;
      --card: #fffdf8;
      --ink: #1f1a14;
      --muted: #6b6256;
      --chai: #c67b2e;
      --line: #e6dcc8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
    .qr {
      width: 220px;
      height: 220px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .upi {
      display: flex;
      gap: 8px;
      margin: 0 0 16px;
    }
    .upi code {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: #f3eee3;
      font-size: 0.95rem;
      word-break: break-all;
    }
    button, .pay {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button { background: #eee6d4; color: var(--ink); }
    .pay { background: var(--chai); color: #fff; width: 100%; }
    .hint { margin-top: 14px; font-size: 0.88rem; }
  </style>
</head>
<body>
  <main>
    <h1>Buy me a chai</h1>
    <p id="blurb">On a computer, scan this QR with any UPI app. On a phone, tap Pay.</p>
    <img id="qr" class="qr" alt="UPI QR code">
    <div class="upi">
      <code id="vpa"></code>
      <button id="copy" type="button">Copy</button>
    </div>
    <a id="pay" class="pay" href="#">Pay with any UPI app</a>
    <p class="hint">Desktop browsers cannot open GPay or PhonePe. Scan the QR, or copy the UPI ID into your phone.</p>
  </main>
  <script>
    // Replace this with your real UPI ID, then the QR and Pay button work.
    const UPI_ID = "kishup713-3@okicici";
    const PAYEE = "Kishan Dobariya";
    const NOTE = "Buy me a chai";
    const payUrl = UPI_ID
      ? "upi://pay?pa=" + encodeURIComponent(UPI_ID) +
        "&pn=" + encodeURIComponent(PAYEE) +
        "&cu=INR&tn=" + encodeURIComponent(NOTE)
      : "";
    document.getElementById("vpa").textContent = UPI_ID || "Add your UPI ID";
    document.getElementById("pay").href = payUrl || "#";
    document.getElementById("qr").src = payUrl
      ? "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
        encodeURIComponent(payUrl)
      : "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Add%20your%20UPI%20ID";
    document.getElementById("copy").onclick = async () => {
      if (!UPI_ID) return;
      await navigator.clipboard.writeText(UPI_ID);
      document.getElementById("copy").textContent = "Copied";
    };
  </script>
</body>
</html>
